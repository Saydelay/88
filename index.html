/* ===== Intro-Editor ===== */
let ieKind = 'series', ieSeries = null, ieSeason = 0, ieEp = null, ieStart = null, ieEnd = null, ieScope = 'series';
function renderAdIntros() {
    const old = $('ie-video'); if (old) { old.pause(); old.removeAttribute('src'); old.load(); }
    const pool = adminList(ieKind);
    const kindChips = `<div class="chips ad-sub">${[['series', 'Serien'], ['movie', 'Filme']].map(([k, l]) =>
        `<button class="chip ${ieKind === k ? 'active' : ''}" data-kind="${k}">${l}</button>`).join('')}</div>`;
    const bindKind = () => $('ad-page').querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { ieKind = b.dataset.kind; ieSeries = null; ieEp = null; renderAdmin(); });
    if (!pool.length) { $('ad-page').innerHTML = kindChips + `<div class="empty" style="padding:40px 0">Noch keine ${ieKind === 'movie' ? 'Filme' : 'Serien'} da.</div>`; bindKind(); return; }
    if (!ieSeries || !pool.find(t => tid(t) === ieSeries)) ieSeries = tid(pool[0]);
    const t = pool.find(x => tid(x) === ieSeries);
    const isMovie = t.type === 'movie';
    let season = null, ep = null;
    if (!isMovie) {
        if (ieSeason >= t.seasons.length) ieSeason = 0;
        season = t.seasons[ieSeason];
        if (!ieEp || !season.episodes.find(e => e.id === ieEp)) ieEp = season.episodes[0] && season.episodes[0].id;
        ep = season.episodes.find(e => e.id === ieEp);
    }
    const it = intros[ieSeries] || {};
    const own = !isMovie && it.eps && it.eps[ieEp];
    const cur = own || (it.end > it.start ? it : null);
    ieStart = cur ? cur.start : null; ieEnd = cur ? cur.end : null;
    ieScope = own ? 'ep' : 'series';
    const file = isMovie ? t.file : ep && ep.file;

    $('ad-page').innerHTML = kindChips + `
        <div class="ie-top">
            <select id="ie-series" class="ad-input">${pool.map(x => `<option value="${esc(tid(x))}" ${tid(x) === ieSeries ? 'selected' : ''}>${esc(x.name)}${intros[tid(x)] ? ' ✓' : ''}</option>`).join('')}</select>
            ${isMovie ? '' : `<div class="chips">${t.seasons.map((x, i) => `<button class="chip ${i === ieSeason ? 'active' : ''}" data-s="${i}">Staffel ${x.number}</button>`).join('')}</div>`}
        </div>
        <div class="ie-wrap">
            <div class="ie-player">
                <video id="ie-video" playsinline preload="metadata"></video>
                <div class="ie-now" id="ie-now">0:00</div>
            </div>
            <div class="ie-track" id="ie-track"><div class="ie-band" id="ie-band"></div><div class="ie-head" id="ie-head"></div>
                <div class="ie-mark s" id="ie-ms"></div><div class="ie-mark e" id="ie-me"></div></div>
            <div class="ie-ticks"><span>0:00</span><span id="ie-dur">–</span></div>
            <div class="ie-ctrl">
                <button class="ad-btn" data-j="-10">−10</button><button class="ad-btn" data-j="-1">−1</button><button class="ad-btn" data-j="-0.2">−⅕</button>
                <button class="ad-btn ie-play" id="ie-play">▶</button>
                <button class="ad-btn" data-j="0.2">+⅕</button><button class="ad-btn" data-j="1">+1</button><button class="ad-btn" data-j="10">+10</button>
            </div>
            <div class="ie-set">
                <div class="ie-time"><span>Intro beginnt</span><input id="ie-s" class="ad-input" placeholder="–:––" inputmode="decimal"><button class="btn ghost ad-small" id="ie-sset">Jetzt</button></div>
                <div class="ie-time"><span>Intro endet</span><input id="ie-e" class="ad-input" placeholder="–:––" inputmode="decimal"><button class="btn ghost ad-small" id="ie-eset">Jetzt</button></div>
            </div>
            <div class="ie-len" id="ie-len"></div>
            <div class="ie-test">
                <button class="btn ghost ad-small" id="ie-t1">▶ Intro ansehen</button>
                <button class="btn ghost ad-small" id="ie-t2">⏭ Sprung testen</button>
            </div>
            ${isMovie ? '' : `<div class="chips ad-sub ie-scope">
                <button class="chip ${ieScope === 'series' ? 'active' : ''}" data-sc="series">Für alle Folgen</button>
                <button class="chip ${ieScope === 'ep' ? 'active' : ''}" data-sc="ep">Nur ${esc(ep ? ep.title : 'diese Folge')}</button>
            </div>`}
            <div class="ad-actions">
                <button class="btn" id="ie-save">Intro speichern</button>
                <button class="btn ghost ad-small danger" id="ie-clear">Entfernen</button>
                <span class="ad-saved" id="ie-ok">✓ Gespeichert</span>
            </div>
            <div class="ad-info ie-keys">Tasten: <b>Leertaste</b> Abspielen · <b>← →</b> 1 s · <b>I</b> Anfang · <b>O</b> Ende</div>
        </div>
        ${isMovie ? '' : `<div class="ad-card-title" style="margin-top:22px">Folgen in Staffel ${season.number}</div>
        <div class="ie-eps">${season.episodes.map(e => {
            const o = it.eps && it.eps[e.id];
            const tag = o ? `<span class="ie-tag own">eigenes Intro</span>` : (it.end > it.start ? `<span class="ie-tag">Serien-Intro</span>` : '<span class="ie-tag none">kein Intro</span>');
            return `<button class="ie-ep ${e.id === ieEp ? 'active' : ''}" data-ep="${esc(e.id)}"><b>${esc(e.title)}</b>${tag}</button>`;
        }).join('')}</div>`}`;
    bindKind();

    const v = $('ie-video');
    if (file) v.src = url(file);
    const parseT = str => { const m = String(str).trim().match(/^(?:(\d+):)?(\d+)(?::(\d+))?(?:[.,](\d+))?$/); if (!m) return null;
        const parts = [m[1], m[2], m[3]].filter(x => x != null).map(Number); let sec = parts.reduce((a, x) => a * 60 + x, 0);
        if (m[4]) sec += Number('0.' + m[4]); return sec; };
    const fmtT = x => x == null ? '' : fmtTime(x) + (x % 1 ? ',' + Math.round((x % 1) * 10) : '');
    const draw = () => {
        if (!v.isConnected || !$('ie-now')) return;   // Editor wurde verlassen
        const d = v.duration || 0;
        $('ie-now').textContent = fmtT(Math.round(v.currentTime * 10) / 10) || '0:00';
        $('ie-play').textContent = v.paused ? '▶' : '❚❚';
        if (!d) return;
        $('ie-dur').textContent = fmtTime(d);
        $('ie-head').style.left = (v.currentTime / d * 100) + '%';
        const okS = ieStart != null, okE = ieEnd != null;
        $('ie-ms').style.display = okS ? '' : 'none'; $('ie-me').style.display = okE ? '' : 'none';
        if (okS) $('ie-ms').style.left = (ieStart / d * 100) + '%';
        if (okE) $('ie-me').style.left = (ieEnd / d * 100) + '%';
        $('ie-band').style.display = okS && okE && ieEnd > ieStart ? '' : 'none';
        if (okS && okE) { $('ie-band').style.left = (ieStart / d * 100) + '%'; $('ie-band').style.width = ((ieEnd - ieStart) / d * 100) + '%'; }
    };
    const showTimes = () => {
        $('ie-s').value = fmtT(ieStart); $('ie-e').value = fmtT(ieEnd);
        $('ie-len').textContent = ieStart != null && ieEnd != null ? (ieEnd > ieStart ? `Länge: ${fmtT(Math.round((ieEnd - ieStart) * 10) / 10)} – wird beim Überspringen ausgelassen` : '⚠ Das Ende muss nach dem Anfang liegen') : 'Spul zum Anfang des Intros und tippe „Jetzt“, dann zum Ende.';
        draw();
    };
    v.ontimeupdate = draw; v.onloadedmetadata = draw; v.onplay = draw; v.onpause = draw; v.onseeked = draw;
    const seek = x => { if (v.duration) v.currentTime = Math.max(0, Math.min(v.duration - 0.1, x)); draw(); };
    $('ie-play').onclick = () => v.paused ? v.play() : v.pause();
    $('ad-page').querySelectorAll('[data-j]').forEach(b => b.onclick = () => seek(v.currentTime + Number(b.dataset.j)));
    const track = $('ie-track');
    const trackSeek = e => { const r = track.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; seek(x / r.width * (v.duration || 0)); };
    track.onpointerdown = e => { trackSeek(e); track.setPointerCapture(e.pointerId); track.onpointermove = trackSeek; };
    track.onpointerup = () => { track.onpointermove = null; };
    $('ie-sset').onclick = () => { ieStart = Math.round(v.currentTime * 10) / 10; showTimes(); };
    $('ie-eset').onclick = () => { ieEnd = Math.round(v.currentTime * 10) / 10; showTimes(); };
    $('ie-s').onchange = () => { ieStart = parseT($('ie-s').value); showTimes(); };
    $('ie-e').onchange = () => { ieEnd = parseT($('ie-e').value); showTimes(); };
    $('ie-t1').onclick = () => { if (ieStart == null) return toast('Erst den Anfang festlegen'); seek(Math.max(0, ieStart - 3)); v.play(); };
    $('ie-t2').onclick = () => {
        if (ieStart == null || ieEnd == null) return toast('Erst Anfang und Ende festlegen');
        seek(ieStart); v.play(); toast('Spielt Intro an – springt nach 2 s zum Ende');
        setTimeout(() => { if (adminView === 'intros') { seek(ieEnd); toast('⏭ Gesprungen – passt der Einstieg?'); } }, 2000);
    };
    $('ie-series').onchange = e => { ieSeries = e.target.value; ieSeason = 0; ieEp = null; renderAdmin(); };
    $('ad-page').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { ieSeason = +b.dataset.s; ieEp = null; renderAdmin(); });
    $('ad-page').querySelectorAll('[data-ep]').forEach(b => b.onclick = () => { ieEp = b.dataset.ep; renderAdmin(); });
    $('ad-page').querySelectorAll('[data-sc]').forEach(b => b.onclick = () => {
        ieScope = b.dataset.sc; $('ad-page').querySelectorAll('[data-sc]').forEach(x => x.classList.toggle('active', x === b));
    });
    $('ie-save').onclick = async () => {
        if (ieStart == null || ieEnd == null || ieEnd <= ieStart) return toast('Bitte gültigen Anfang und Ende festlegen');
        try {
            const j = await adminPost('intro', { series: ieSeries, ep: !isMovie && ieScope === 'ep' ? ieEp : '', start: ieStart, end: ieEnd });
            intros = j.intros || intros;
            const el = $('ie-ok'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1400);
            // Liste der Folgen aktualisieren, Video weiterlaufen lassen
            const pos = v.currentTime, wasPlaying = !v.paused;
            v.pause(); v.removeAttribute('src'); v.load();   // altes Vorschau-Video sauber beenden
            renderAdmin();
            const nv = $('ie-video'); nv.addEventListener('loadedmetadata', () => { nv.currentTime = pos; if (wasPlaying) nv.play(); }, { once: true });
        } catch (e) { if (e.message !== '403') toast('Speichern fehlgeschlagen: ' + e.message); }
    };
    $('ie-clear').onclick = async () => {
        const msg = isMovie ? 'Intro dieses Films entfernen?' : ieScope === 'ep' ? 'Eigenes Intro dieser Folge entfernen?' : 'Serien-Intro entfernen (gilt für alle Folgen ohne eigenes Intro)?';
        if (!confirm(msg)) return;
        try { const j = await adminPost('intro', { series: ieSeries, ep: !isMovie && ieScope === 'ep' ? ieEp : '', clear: true }); intros = j.intros || intros; renderAdmin(); toast('Entfernt'); }
        catch (e) {}
    };
    // Tastatur am PC
    document.onkeydown = e => {
        if (adminView !== 'intros' || !$('admin').classList.contains('show') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
        if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
        else if (e.key === 'ArrowLeft') seek(v.currentTime - 1);
        else if (e.key === 'ArrowRight') seek(v.currentTime + 1);
        else if (e.key.toLowerCase() === 'i') $('ie-sset').click();
        else if (e.key.toLowerCase() === 'o') $('ie-eset').click();
    };
    showTimes();
}

/* ===== Einstellungen: Profile, Mitteilung, Passwörter, Sicherung ===== */
async function renderAdSettings() {
    try { await fetchState(); } catch (e) {}
    if (adminView !== 'settings') return;
    const st = lastState || {};
    const profRows = profiles.map((p, k) => {
        const pr = (st.progress && st.progress[p.id]) || {};
        const last = Object.entries(pr).filter(([id]) => byId[id]).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0))[0];
        const done = Object.values(pr).filter(x => x.done).length;
        let lastTxt = 'noch nichts geschaut';
        if (last) { const ref = byId[last[0]]; lastTxt = 'zuletzt: ' + ref.title.name + (ref.title.type === 'series' ? ` · S${ref.title.seasons[ref.si].number} ${ref.title.seasons[ref.si].episodes[ref.ei].title}` : ''); }

    $('ad-page').innerHTML = `

            <div class="ad-list">${profRows}</div>
            <div class="ad-actions">${profiles.length < 6 ? '<button class="btn ghost ad-small" id="pf-add">+ Profil hinzufügen</button>' : ''}<span class="ad-saved" id="pf-ok">✓ Gespeichert</span></div>
            <div class="st-sub">Tippe auf das Symbol, um die Farbe zu ändern. Namen werden beim Verlassen des Feldes gespeichert.</div>
        </div>
        <div class="ad-card">
            <div class="ad-card-title">Mitteilung an alle</div>
            <textarea id="nt-text" class="ad-input" rows="3" maxlength="400" placeholder="z. B. „Neu: Staffel 7 von Dexter ist da! 🎉“">${esc((notice && notice.text) || '')}</textarea>
            <div class="ad-actions"><button class="btn ad-small" id="nt-save">Anzeigen</button><button class="btn ghost ad-small" id="nt-clear">Entfernen</button><span class="ad-saved" id="nt-ok">✓ Gespeichert</span></div>
            <div class="st-sub">Erscheint oben auf der Startseite – bei allen, bis sie sie wegtippen.</div>
        </div>
        <div class="ad-card">
            <div class="ad-card-title">Passwörter</div>
            <div class="pw-grid">
                <label>Neues Passwort für alle<input id="pw-key" class="ad-input" autocomplete="new-password" placeholder="leer = unverändert"></label>
                <label>Neues Admin-Passwort<input id="pw-admin" class="ad-input" autocomplete="new-password" placeholder="leer = unverändert"></label>
            </div>
            <div class="ad-actions"><button class="btn ad-small" id="pw-save">Passwörter ändern</button></div>
            <div class="st-sub">Nur Buchstaben und Zahlen. Nach einer Änderung des normalen Passworts müssen sich alle anderen Geräte neu anmelden – dieses Gerät bleibt angemeldet.</div>
        </div>
        <div class="ad-card">
            <div class="ad-card-title">Sicherung</div>
            <div class="st-sub" style="margin-top:0">Speichert Profile, Fortschritt, Meine Listen, Intros, Namen, Reihenfolge und Mitteilung in einer Datei. Filme selbst sind nicht enthalten.</div>
            <div class="ad-actions"><button class="btn ghost ad-small" id="bk-down">Sicherung herunterladen</button>
                <label class="btn ghost ad-small" style="cursor:pointer">Sicherung einspielen<input type="file" id="bk-up" accept=".json,application/json" hidden></label></div>
        </div>
        <div class="ad-card">

            <div class="ad-actions"><button class="btn ghost ad-small" id="ad-leave">Admin-Modus auf diesem Gerät beenden</button></div>
        </div>`;

    // --- Profile ---
    const saveProfiles = async (list, msg) => {
        try {
            const j = await adminPost('profiles', { profiles: list });
            profiles = j.profiles; updateProfileButton();
            const ok = $('pf-ok'); if (ok) { ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 1200); }
            if (msg) toast(msg);
            return true;
        } catch (e) { if (e.message !== '403') toast(e.message); return false; }
    };
    const plain = () => profiles.map(p => ({ id: p.id, name: p.name, color: p.color != null ? p.color : (parseInt(p.id.slice(1), 10) - 1) % 8 }));
    $('ad-page').querySelectorAll('[data-name]').forEach(inp => inp.onchange = async () => {
        const list = plain(); const v = inp.value.trim().slice(0, 20);
        if (!v) { inp.value = list[+inp.dataset.name].name; return; }
        list[+inp.dataset.name].name = v; await saveProfiles(list);
    });
    $('ad-page').querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
        const k = +b.dataset.color;
        sheetMenu('Farbe für ' + esc(profiles[k].name), PALETTE.map((c, ci) => ({
            label: `<span class="color-dot" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></span>${['Lila', 'Türkis', 'Orange', 'Grün', 'Rot', 'Indigo', 'Gelb', 'Grau'][ci]}`,
            run: async () => { const list = plain(); list[k].color = ci; if (await saveProfiles(list)) renderAdmin(); }
        })));
    });
    $('ad-page').querySelectorAll('[data-pmore]').forEach(b => b.onclick = () => {
        const k = +b.dataset.pmore, p = profiles[k];
        sheetMenu(esc(p.name), [
            { label: 'Fortschritt löschen', icon: 'trash', run: async () => {
                if (!confirm(`Gesamten Fortschritt von „${p.name}“ löschen?\n(„Gesehen“-Haken und „Weiterschauen“)`)) return;
                try {
                    await adminPost('reset-progress', { profile: p.id });
                    try { localStorage.removeItem('saydelay_progress_' + p.id); } catch (e) {}
                    if (p.id === profileId) progress = {};
                    toast('Fortschritt gelöscht'); renderAdmin();
                } catch (e) {}
            } },
            ...(profiles.length > 1 ? [{ label: 'Profil löschen', icon: 'trash', danger: true, run: async () => {
                if (!confirm(`Profil „${p.name}“ mit Fortschritt und Meiner Liste löschen?`)) return;
                const list = plain().filter(x => x.id !== p.id);
                if (await saveProfiles(list, 'Profil gelöscht')) {
                    if (profileId === p.id) { profileId = ''; store.set('saydelay_profile', ''); }
                    renderAdmin();
                }
            } }] : []),
        ]);
    });
    if ($('pf-add')) $('pf-add').onclick = async () => {
        const used = new Set(profiles.map(p => p.id));
        let n = 1; while (used.has('p' + n)) n++;
        const list = plain(); list.push({ id: 'p' + n, name: 'Profil ' + n, color: (n - 1) % 8 });
        if (await saveProfiles(list, 'Profil hinzugefügt')) renderAdmin();
    };

        try { const j = await adminPost('notice', { text }); notice = j.notice; if (!text) $('nt-text').value = '';
            const ok = $('nt-ok'); ok.classList.add('show'); setTimeout(() => ok.classList.remove('show'), 1200); }
        catch (e) { if (e.message !== '403') toast('Speichern fehlgeschlagen'); }
    };
    $('nt-save').onclick = () => { const t = $('nt-text').value.trim(); if (!t) return toast('Bitte erst einen Text eingeben'); saveNotice(t); };
    $('nt-clear').onclick = () => saveNotice('');

    // --- Passwörter ---
    $('pw-save').onclick = async () => {
        const key = $('pw-key').value.trim(), admin = $('pw-admin').value.trim();
        if (!key && !admin) return toast('Bitte mindestens ein neues Passwort eingeben');
        const bad = [key, admin].find(x => x && !/^[A-Za-z0-9]{3,64}$/.test(x));
        if (bad) return toast('Nur Buchstaben und Zahlen, 3–64 Zeichen');
        if (!confirm('Passwörter wirklich ändern?' + (key ? '\n\nAlle anderen Geräte müssen sich danach neu anmelden.' : ''))) return;
        try {
            const j = await adminPost('passwords', { key, admin });
            store.set('saydelay_key', j.key); store.set('saydelay_admin', j.token);
            $('pw-key').value = ''; $('pw-admin').value = '';
            toast('✓ Passwörter geändert');
        } catch (e) { if (e.message !== '403') toast(e.message); }
    };

    // --- Sicherung ---
    $('bk-down').onclick = async () => {
        try {
            const j = await adminPost('backup');
            const blob = new Blob([JSON.stringify(j, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `saydelay-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        } catch (e) { if (e.message !== '403') toast('Sicherung fehlgeschlagen'); }
    };
    $('bk-up').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        try {
            const j = JSON.parse(await f.text());
            if (!j || !j.state) throw new Error('Keine gültige SAYDELAY-Sicherung.');
            if (!confirm(`Sicherung vom ${j.created || '?'} einspielen?\nDer aktuelle Stand (Fortschritt, Listen, Intros …) wird ersetzt.`)) return;
            await adminPost('restore-backup', { state: j.state });
            await reloadLibrary(); toast('✓ Sicherung eingespielt');
        } catch (err) { toast(err.message === '403' ? 'Kein Zugriff' : (err.message || 'Datei konnte nicht gelesen werden')); }
        e.target.value = '';
    };
    $('ad-leave').onclick = leaveAdmin;
}

partyFromLink();

function readCache(k) { try { return JSON.parse(store.get(k) || 'null'); } catch (e) { return null; } }

function start(fromLogin) {
    if (!MEDIA) MEDIA = piUrl() ? piUrl() + '/media/' : '';
    if (!store.get('saydelay_key')) return showLock();

    // 1) Sofort: letzte bekannte Filmliste vom Gerät anzeigen (klappt auch ohne Internet)
    let fromCache = false;
    const cLib = !fromLogin && readCache('saydelay_cache_lib');
    if (cLib && cLib.dirs) {
        fromCache = true;
        LIB = cLib.dirs;
        const cSt = readCache('saydelay_cache_state');
        if (cSt) { applyLibraryState(cSt); if (Array.isArray(cSt.profiles) && cSt.profiles.length) profiles = cSt.profiles; }
        hideLock();
        loadLibrary().then(() => {
            updateAdminButton();
            if (profileId && profiles.find(p => p.id === profileId)) { useProfile(profileId, null); render(); }
            else { render(); showProfiles(); }
        }).catch(() => {});
    } else if (!fromLogin) {
        $('content').innerHTML = '<div class="grid">' + '<div class="skel"></div>'.repeat(6) + '</div>';
    }

    // 2) Im Hintergrund: aktuelle Daten vom Pi holen (Filmliste und Profile gleichzeitig)
    Promise.all([
        loadIndex().then(() => list('')).then(() => { hideLock(); return loadLibrary(); }),
        fetchState(),
    ]).then(([, st]) => {
        updateAdminButton();
        const picking = $('profiles').classList.contains('show');
        if (!profileId || !profiles.find(p => p.id === profileId)) { render(); if (!picking) showProfiles(); else renderProfiles(); }
        else { useProfile(profileId, st); if (picking) renderProfiles(); refresh(); }
        if (openAdminAfterLogin) { openAdminAfterLogin = false; showAdmin(); }
    }).catch(async err => {
        // Bei der Anmeldung: war es vielleicht das Admin-Passwort?
        if (fromLogin && lastPw) {
            const pw = lastPw; lastPw = '';
            const res = await tryAdminLogin(pw);
            if (res === true) { openAdminAfterLogin = true; return start(true); }
            if (res === 'locked') { store.set('saydelay_key', ''); return showLock('Zu viele Versuche – warte 10 Minuten', true); }
        }
        if (err.message === 'KEY') {
            store.set('saydelay_key', '');
            showLock('Falsches Passwort', fromLogin);
        }
        else if (fromCache) toast('Offline – du siehst die zuletzt geladene Liste');
        else showLock('Keine Verbindung zum Pi – ist er eingeschaltet?', true);
    });
}
start();
</script>
